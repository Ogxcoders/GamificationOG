[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/formulas",
    "crates/rules",
    "crates/progression",
    "crates/ranking",
    "crates/simulation",
    "crates/core-engine",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["GamificationOG"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
