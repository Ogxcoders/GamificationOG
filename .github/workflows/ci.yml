name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web platform — build + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:/home/runner/custom.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma client + schema
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate --accept-data-loss

      - name: Seed reference project
        run: bun run seed

      - name: Production build
        run: bun run build

      - name: Full E2E suite (run-all-tests.sh)
        run: bash scripts/run-all-tests.sh
        env:
          DATABASE_URL: file:/home/runner/custom.db
        # e2e-rust-parity is skipped here (no Rust toolchain in this job);
        # it runs in the dedicated rust job below.

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-logs
          path: |
            .zscripts/
            dev.log
          if-no-files-found: ignore

  rust:
    name: Rust core engine — unit + TS parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine workspace
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: TS-Rust parity (bit-identical simulation)
        run: |
          bun install --frozen-lockfile
          bunx prisma generate
          bun scripts/e2e-rust-parity.ts

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  go:
    name: Go services — gateway + MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t gamificationog:ci .

      - name: Boot smoke (container)
        run: |
          docker run -d --name gog-ci -p 3000:3000 gamificationog:ci
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health && break || sleep 3
          done
          curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200" ]
          docker rm -f gog-ci
